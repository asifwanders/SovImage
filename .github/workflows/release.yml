name: desktop release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts without creating a GitHub Release
        type: boolean
        required: true
        default: true
      release_tag:
        description: Existing vX.Y.Z tag at this commit; required when dry_run is false
        type: string
        required: false

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CUDA_VERSION: '12.5.0'
  RUST_BACKTRACE: '1'

jobs:
  verify:
    name: verify exact source
    uses: ./.github/workflows/ci.yml

  prepare:
    name: resolve release mode
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
      release_tag: ${{ steps.mode.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: mode
        name: Validate tag and dry-run selection
        shell: bash
        env:
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            dry_run=false
          elif [[ "$DISPATCH_DRY_RUN" == "true" ]]; then
            tag="dry-run-$GITHUB_RUN_NUMBER"
            dry_run=true
          else
            tag="$DISPATCH_RELEASE_TAG"
            dry_run=false
          fi
          if [[ "$dry_run" == "false" ]]; then
            git show-ref --verify --quiet "refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
            python3 scripts/verify-release-version.py "$tag"
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  build-engine:
    name: engine (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - id: engine
        name: Resolve pinned engine commit
        shell: bash
        run: echo "sha=$(git -C vendor/stable-diffusion.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: toolchain
        name: Fingerprint native toolchain
        shell: bash
        run: echo "value=$(bash scripts/native-toolchain-fingerprint.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: engine-cache
        with:
          path: |
            vendor/sdcpp-build-mac
            vendor/sdcpp-build-win
            frontend/src-tauri/binaries
          key: sdcpp-${{ matrix.target }}-${{ steps.toolchain.outputs.value }}-cuda-${{ env.CUDA_VERSION }}-${{ steps.engine.outputs.sha }}-${{ hashFiles('scripts/native-toolchain-fingerprint.sh', 'scripts/build-sdcpp-*', 'scripts/verify-sdcpp-cli.sh', 'scripts/verify-sdcpp-runtime.ps1') }}
      - name: Build Metal engine
        if: matrix.os == 'macos-15' && steps.engine-cache.outputs.cache-hit != 'true'
        run: scripts/build-sdcpp-mac.sh
      - name: Install CUDA toolkit
        if: matrix.os == 'windows-2022' && steps.engine-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","visual_studio_integration"]'
      - name: Build CUDA engine and runtime closure
        if: matrix.os == 'windows-2022' && steps.engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/build-sdcpp-win.ps1
      - name: Verify engine CLI and provenance
        shell: bash
        run: |
          binary="frontend/src-tauri/binaries/sd-${{ matrix.target }}"
          if [[ "${{ matrix.os }}" == "windows-2022" ]]; then binary="$binary.exe"; fi
          scripts/verify-sdcpp-cli.sh "$binary" '${{ steps.engine.outputs.sha }}'
      - name: Verify Windows runtime manifest
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: scripts/verify-sdcpp-runtime.ps1 -Root frontend/src-tauri/binaries -ExpectedEngineCommit '${{ steps.engine.outputs.sha }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-${{ matrix.target }}
          path: |
            frontend/src-tauri/binaries/sd-${{ matrix.target }}*
            frontend/src-tauri/binaries/*.dll
            frontend/src-tauri/binaries/sdcpp-runtime-manifest.json
          if-no-files-found: error
          retention-days: 7

  build-desktop:
    name: desktop (${{ matrix.target }})
    needs: [prepare, build-engine]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows
    runs-on: ${{ matrix.os }}
    environment:
      name: ${{ needs.prepare.outputs.dry_run == 'false' && 'desktop-release' || 'desktop-dry-run' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-${{ matrix.target }}
          path: frontend/src-tauri/binaries
      - name: Verify Windows runtime manifest
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $expected = (git -C vendor/stable-diffusion.cpp rev-parse HEAD).Trim()
          scripts/verify-sdcpp-runtime.ps1 -Root frontend/src-tauri/binaries -ExpectedEngineCommit $expected
      - name: Clean-machine engine smoke
        shell: bash
        run: |
          binary="frontend/src-tauri/binaries/sd-${{ matrix.target }}"
          expected="$(git -C vendor/stable-diffusion.cpp rev-parse HEAD)"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            binary="$binary.exe"
            export PATH="$(pwd)/frontend/src-tauri/binaries:/usr/bin:/bin"
          else
            chmod +x "$binary"
          fi
          scripts/verify-sdcpp-cli.sh "$binary" "$expected"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Node/npm toolchain
        run: node scripts/verify-node-toolchain.mjs
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action pin; toolchain 1.98.0
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: frontend/src-tauri -> target
          shared-key: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Require macOS public-release credentials
        if: matrix.platform == 'macos' && needs.prepare.outputs.dry_run == 'false'
        shell: bash
        env:
          MAC_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MAC_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$MAC_CERT" && test -n "$MAC_CERT_PASSWORD" && test -n "$MAC_IDENTITY"
          test -n "$APPLE_ISSUER" && test -n "$APPLE_KEY" && test -n "$APPLE_KEY_P8" && test -n "$KEYCHAIN_PASSWORD"
      - name: Require Windows public-release credentials
        if: matrix.platform == 'windows' && needs.prepare.outputs.dry_run == 'false'
        shell: bash
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: test -n "$WIN_CERT" && test -n "$WIN_CERT_PASSWORD"
      - name: Import Developer ID certificate and API key
        if: matrix.platform == 'macos' && needs.prepare.outputs.dry_run == 'false'
        shell: bash
        env:
          CERTIFICATE_B64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          API_KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APP_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/sovimage-direct.keychain-db"
          printf '%s' "$CERTIFICATE_B64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F -- "$APP_IDENTITY"
      - id: windows-signing
        name: Import Windows signing certificate
        if: matrix.platform == 'windows' && needs.prepare.outputs.dry_run == 'false'
        shell: pwsh
        env:
          CERTIFICATE_B64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sovimage.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_B64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password) |
            Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $cert) { throw 'Windows signing certificate has no private key' }
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
            tsp = $true
          } } }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 frontend/src-tauri/tauri.windows.signing.conf.json
      - name: Sign Windows inference engine
        if: matrix.platform == 'windows' && needs.prepare.outputs.dry_run == 'false'
        shell: pwsh
        run: |
          $engine = 'frontend/src-tauri/binaries/sd-x86_64-pc-windows-msvc.exe'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool sign /sha1 '${{ steps.windows-signing.outputs.thumbprint }}' /fd sha256 /tr http://timestamp.digicert.com /td sha256 $engine
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed for the inference engine' }
          $signature = Get-AuthenticodeSignature $engine
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
            throw "Invalid or untimestamped inference engine signature: $($signature.Status)"
          }
      - name: Build macOS dry-run DMG
        if: matrix.platform == 'macos' && needs.prepare.outputs.dry_run == 'true'
        working-directory: frontend
        env:
          APPLE_SIGNING_IDENTITY: '-'
          SOVIMAGE_BUILD_CHANNEL: dry-run
          SOVIMAGE_BUILD_NUMBER: ${{ github.run_number }}
          SOVIMAGE_SOURCE_REF: ${{ needs.prepare.outputs.release_tag }}
        run: npm run tauri build -- --target aarch64-apple-darwin --features real_runtime --bundles dmg -- --no-default-features --locked
      - name: Build signed and notarized macOS DMG
        if: matrix.platform == 'macos' && needs.prepare.outputs.dry_run == 'false'
        working-directory: frontend
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          SOVIMAGE_BUILD_CHANNEL: direct
          SOVIMAGE_BUILD_NUMBER: ${{ github.run_number }}
          SOVIMAGE_SOURCE_REF: ${{ needs.prepare.outputs.release_tag }}
        run: npm run tauri build -- --target aarch64-apple-darwin --features real_runtime --bundles dmg -- --no-default-features --locked
      - name: Build Windows dry-run installer
        if: matrix.platform == 'windows' && needs.prepare.outputs.dry_run == 'true'
        working-directory: frontend
        env:
          SOVIMAGE_BUILD_CHANNEL: dry-run
          SOVIMAGE_BUILD_NUMBER: ${{ github.run_number }}
          SOVIMAGE_SOURCE_REF: ${{ needs.prepare.outputs.release_tag }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --features real_runtime --bundles nsis -- --no-default-features --locked
      - name: Build signed Windows installer
        if: matrix.platform == 'windows' && needs.prepare.outputs.dry_run == 'false'
        working-directory: frontend
        env:
          SOVIMAGE_BUILD_CHANNEL: direct
          SOVIMAGE_BUILD_NUMBER: ${{ github.run_number }}
          SOVIMAGE_SOURCE_REF: ${{ needs.prepare.outputs.release_tag }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: npm run tauri build -- --config src-tauri/tauri.windows.signing.conf.json --target x86_64-pc-windows-msvc --features real_runtime --bundles nsis -- --no-default-features --locked
      - name: Verify build provenance
        working-directory: frontend
        shell: bash
        env:
          SOVIMAGE_BUILD_CHANNEL: ${{ needs.prepare.outputs.dry_run == 'false' && 'direct' || 'dry-run' }}
          SOVIMAGE_BUILD_NUMBER: ${{ github.run_number }}
          SOVIMAGE_SOURCE_REF: ${{ needs.prepare.outputs.release_tag }}
        run: |
          node ../scripts/write-build-provenance.mjs --verify
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            cmp src-tauri/resources/build-provenance.json src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SovImage.app/Contents/Resources/build-provenance.json
          fi
      - name: Verify notarized macOS artifact
        if: matrix.platform == 'macos' && needs.prepare.outputs.dry_run == 'false'
        shell: bash
        env:
          EXPECTED_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: |
          app="frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SovImage.app"
          helper="$app/Contents/MacOS/sd"
          main="$app/Contents/MacOS/$(defaults read "$app/Contents/Info" CFBundleExecutable)"
          dmg="$(find frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$helper"
          codesign -dv --verbose=4 "$helper" 2>&1 | grep -F -- "Authority=$EXPECTED_IDENTITY"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"
          test "$(defaults read "$app/Contents/Info" LSMinimumSystemVersion)" = "12.0"
          test "$(lipo -archs "$main")" = "arm64"
          test "$(lipo -archs "$helper")" = "arm64"
          test "$(vtool -show-build "$main" | awk '/minos/{print $2; exit}')" = "12.0"
          test "$(vtool -show-build "$helper" | awk '/minos/{print $2; exit}')" = "12.0"
      - name: Install and verify Windows payload
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          $installDir = Join-Path $env:RUNNER_TEMP 'SovImage-clean-install'
          & $installer.FullName /S "/D=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "NSIS install failed with exit code $LASTEXITCODE" }
          $app = Join-Path $installDir 'SovImage.exe'
          $engine = Join-Path $installDir 'sd.exe'
          $provenance = Join-Path $installDir 'build-provenance.json'
          foreach ($file in @($app, $engine)) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Installed payload missing: $file" }
          }
          if ((Get-FileHash -Algorithm SHA256 $provenance).Hash -ne
              (Get-FileHash -Algorithm SHA256 'frontend/src-tauri/resources/build-provenance.json').Hash) {
            throw 'Installed build provenance differs from the verified source record'
          }
          scripts/verify-sdcpp-runtime.ps1 -Root $installDir -ExpectedEngineCommit (git -C vendor/stable-diffusion.cpp rev-parse HEAD).Trim() -AllowAdditionalDlls
          $env:PATH = "$installDir;$env:SystemRoot\System32"
          $help = (& $engine -h 2>&1) -join "`n"
          $engineStatus = $LASTEXITCODE
          $expectedEngine = (git -C vendor/stable-diffusion.cpp rev-parse --short=7 HEAD).Trim()
          if ($engineStatus -ne 0 -or $help -notmatch [regex]::Escape($expectedEngine)) {
            throw 'Installed inference engine failed its provenance smoke check'
          }
          if ('${{ needs.prepare.outputs.dry_run }}' -eq 'false') {
            foreach ($file in @($app, $engine, $installer.FullName)) {
              $signature = Get-AuthenticodeSignature $file
              if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
                throw "Invalid or untimestamped signature on $file: $($signature.Status)"
              }
            }
          }
      - name: Write macOS checksum
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          dmg="$(find frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          cd "$(dirname "$dmg")"
          shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256"
      - name: Write Windows checksum
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($installer.FullName).sha256", "$hash  $($installer.Name)`n")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.platform == 'macos'
        with:
          name: desktop-macos-${{ needs.prepare.outputs.release_tag }}
          path: |
            frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.sha256
            frontend/src-tauri/resources/build-provenance.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.platform == 'windows'
        with:
          name: desktop-windows-${{ needs.prepare.outputs.release_tag }}
          path: |
            frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
            frontend/src-tauri/resources/build-provenance.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: draft GitHub Release
    if: needs.prepare.outputs.dry_run == 'false'
    needs: [prepare, build-desktop]
    runs-on: ubuntu-24.04
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify Node/npm toolchain
        run: node scripts/verify-node-toolchain.mjs
      - name: Require exact-commit publication attestations
        shell: bash
        env:
          LEGAL_REVIEW_COMMIT: ${{ vars.SOVIMAGE_LEGAL_REVIEW_COMMIT }}
          ACTION_PINS_REVIEW_COMMIT: ${{ vars.SOVIMAGE_ACTION_PINS_REVIEW_COMMIT }}
          DEPENDENCY_AUDIT_COMMIT: ${{ vars.SOVIMAGE_DEPENDENCY_AUDIT_COMMIT }}
          WINDOWS_REDISTRIBUTION_REVIEW_COMMIT: ${{ vars.SOVIMAGE_WINDOWS_REDISTRIBUTION_REVIEW_COMMIT }}
          NAME_BUNDLE_ID_CLEARANCE_COMMIT: ${{ vars.SOVIMAGE_NAME_BUNDLE_ID_CLEARANCE_COMMIT }}
        run: |
          test "$LEGAL_REVIEW_COMMIT" = "$GITHUB_SHA"
          test "$ACTION_PINS_REVIEW_COMMIT" = "$GITHUB_SHA"
          test "$DEPENDENCY_AUDIT_COMMIT" = "$GITHUB_SHA"
          test "$WINDOWS_REDISTRIBUTION_REVIEW_COMMIT" = "$GITHUB_SHA"
          test "$NAME_BUNDLE_ID_CLEARANCE_COMMIT" = "$GITHUB_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*-${{ needs.prepare.outputs.release_tag }}
          path: dist
      - name: Verify assets and create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOVIMAGE_BUILD_CHANNEL: direct
          SOVIMAGE_BUILD_NUMBER: ${{ github.run_number }}
          SOVIMAGE_SOURCE_REF: ${{ needs.prepare.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "error: release $RELEASE_TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          mapfile -d '' dmgs < <(find dist -type f -name '*.dmg' -print0)
          mapfile -d '' installers < <(find dist -type f -name '*-setup.exe' -print0)
          mapfile -d '' checksums < <(find dist -type f -name '*.sha256' -print0)
          mapfile -d '' provenance < <(find dist -type f -name 'build-provenance.json' -print0)
          test "${#dmgs[@]}" -eq 1
          test "${#installers[@]}" -eq 1
          test "${#checksums[@]}" -eq 2
          test "${#provenance[@]}" -eq 2
          cmp "${provenance[0]}" "${provenance[1]}"
          for record in "${provenance[@]}"; do
            node scripts/write-build-provenance.mjs --verify "$record"
          done
          for checksum in "${checksums[@]}"; do
            (cd "$(dirname "$checksum")" && sha256sum --check "$(basename "$checksum")")
          done
          files=("${dmgs[@]}" "${installers[@]}" "${checksums[@]}" "${provenance[0]}")
          gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --draft --generate-notes --title "SovImage $RELEASE_TAG"
