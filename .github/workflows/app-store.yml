name: Mac App Store

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the validated package to App Store Connect
        type: boolean
        required: true
        default: false
      build_number:
        description: Positive CFBundleVersion; defaults to the workflow run number
        type: string
        required: false

concurrency:
  group: mac-app-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify exact source
    uses: ./.github/workflows/ci.yml

  package:
    name: signed package and Apple validation
    needs: verify
    runs-on: macos-15
    environment: app-store
    outputs:
      build_number: ${{ steps.values.outputs.build_number }}
      artifact_name: ${{ steps.values.outputs.artifact_name }}
      package_sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - id: values
        name: Validate inputs and credentials
        shell: bash
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          APP_CERT: ${{ secrets.APPLE_MAS_APP_CERTIFICATE_P12_BASE64 }}
          APP_CERT_PASSWORD: ${{ secrets.APPLE_MAS_APP_CERTIFICATE_PASSWORD }}
          INSTALLER_CERT: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_MAS_PROVISION_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_IDENTITY: ${{ secrets.APPLE_DISTRIBUTION_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          build_number="${INPUT_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          for value in APP_CERT APP_CERT_PASSWORD INSTALLER_CERT INSTALLER_CERT_PASSWORD PROFILE TEAM_ID APP_IDENTITY INSTALLER_IDENTITY API_ISSUER API_KEY API_KEY_P8 KEYCHAIN_PASSWORD; do
            test -n "${!value}"
          done
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "artifact_name=SovImage-AppStore-build-$build_number-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Node/npm toolchain
        run: node scripts/verify-node-toolchain.mjs
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action pin; toolchain 1.98.0
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin
      - id: engine
        name: Resolve engine commit
        run: echo "sha=$(git -C vendor/stable-diffusion.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: toolchain
        name: Fingerprint native toolchain
        shell: bash
        run: echo "value=$(bash scripts/native-toolchain-fingerprint.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: engine-cache
        with:
          path: |
            vendor/sdcpp-build-mac
            frontend/src-tauri/binaries/sd-aarch64-apple-darwin
          key: sdcpp-appstore-${{ steps.toolchain.outputs.value }}-${{ steps.engine.outputs.sha }}-${{ hashFiles('scripts/native-toolchain-fingerprint.sh', 'scripts/build-sdcpp-mac.sh', 'scripts/verify-sdcpp-cli.sh') }}
      - name: Build engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: scripts/build-sdcpp-mac.sh
      - name: Verify engine
        run: scripts/verify-sdcpp-cli.sh frontend/src-tauri/binaries/sd-aarch64-apple-darwin '${{ steps.engine.outputs.sha }}'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Import Apple certificates and API key
        shell: bash
        env:
          APP_CERT: ${{ secrets.APPLE_MAS_APP_CERTIFICATE_P12_BASE64 }}
          APP_CERT_PASSWORD: ${{ secrets.APPLE_MAS_APP_CERTIFICATE_PASSWORD }}
          INSTALLER_CERT: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APP_IDENTITY: ${{ secrets.APPLE_DISTRIBUTION_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/sovimage-appstore.keychain-db"
          printf '%s' "$APP_CERT" | base64 --decode > "$RUNNER_TEMP/app-distribution.p12"
          printf '%s' "$INSTALLER_CERT" | base64 --decode > "$RUNNER_TEMP/installer-distribution.p12"
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY}.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$RUNNER_TEMP/app-distribution.p12" -k "$keychain" -P "$APP_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer-distribution.p12" -k "$keychain" -P "$INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F -- "$APP_IDENTITY"
          security find-certificate -c "$INSTALLER_IDENTITY" "$keychain" >/dev/null
      - name: Render and validate App Store profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_MAS_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_MAS_PROVISION_PROFILE_BASE64 }}
        run: scripts/render-app-store-files.sh
      - name: Build App Store app bundle
        working-directory: frontend
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DISTRIBUTION_IDENTITY }}
          SOVIMAGE_BUILD_CHANNEL: app-store
          SOVIMAGE_BUILD_NUMBER: ${{ steps.values.outputs.build_number }}
          SOVIMAGE_SOURCE_REF: ${{ github.ref_name }}
        run: npm run tauri build -- --config src-tauri/tauri.appstore.conf.json --target aarch64-apple-darwin --features real_runtime --bundles app -- --no-default-features --locked
      - name: Verify source and bundled provenance
        working-directory: frontend
        env:
          SOVIMAGE_BUILD_CHANNEL: app-store
          SOVIMAGE_BUILD_NUMBER: ${{ steps.values.outputs.build_number }}
          SOVIMAGE_SOURCE_REF: ${{ github.ref_name }}
        run: |
          node ../scripts/write-build-provenance.mjs --verify
          cmp src-tauri/resources/build-provenance.json src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SovImage.app/Contents/Resources/build-provenance.json
      - id: package
        name: Re-sign helper correctly and create installer package
        env:
          APPLE_DISTRIBUTION_IDENTITY: ${{ secrets.APPLE_DISTRIBUTION_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/package-app-store.sh frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SovImage.app "$RUNNER_TEMP/SovImage.pkg" '${{ steps.values.outputs.build_number }}'
          echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/SovImage.pkg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.values.outputs.artifact_name }}
          path: ${{ runner.temp }}/SovImage.pkg
          if-no-files-found: error
          retention-days: 14
      - name: Validate with App Store Connect
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: xcrun altool --validate-app -f "$RUNNER_TEMP/SovImage.pkg" -t macos --apiKey "$API_KEY" --apiIssuer "$API_ISSUER" --p8-file-path "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY}.p8"

  upload:
    name: upload exact validated package
    if: inputs.upload
    needs: package
    runs-on: macos-15
    environment: app-store
    steps:
      - name: Require exact-commit upload attestations
        shell: bash
        env:
          LEGAL_REVIEW_COMMIT: ${{ vars.SOVIMAGE_LEGAL_REVIEW_COMMIT }}
          ACTION_PINS_REVIEW_COMMIT: ${{ vars.SOVIMAGE_ACTION_PINS_REVIEW_COMMIT }}
          DEPENDENCY_AUDIT_COMMIT: ${{ vars.SOVIMAGE_DEPENDENCY_AUDIT_COMMIT }}
          PRIVACY_REVIEW_COMMIT: ${{ vars.SOVIMAGE_PRIVACY_REVIEW_COMMIT }}
          NAME_BUNDLE_ID_CLEARANCE_COMMIT: ${{ vars.SOVIMAGE_NAME_BUNDLE_ID_CLEARANCE_COMMIT }}
        run: |
          test "$LEGAL_REVIEW_COMMIT" = "$GITHUB_SHA"
          test "$ACTION_PINS_REVIEW_COMMIT" = "$GITHUB_SHA"
          test "$DEPENDENCY_AUDIT_COMMIT" = "$GITHUB_SHA"
          test "$PRIVACY_REVIEW_COMMIT" = "$GITHUB_SHA"
          test "$NAME_BUNDLE_ID_CLEARANCE_COMMIT" = "$GITHUB_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/app-store-candidate
      - name: Verify validated package identity
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.package_sha256 }}
        run: test "$(shasum -a 256 "$RUNNER_TEMP/app-store-candidate/SovImage.pkg" | awk '{print $1}')" = "$EXPECTED_SHA256"
      - name: Upload to App Store Connect
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          key_path="$RUNNER_TEMP/private_keys/AuthKey_${API_KEY}.p8"
          printf '%s' "$API_KEY_P8" | base64 --decode > "$key_path"
          xcrun altool --upload-app -f "$RUNNER_TEMP/app-store-candidate/SovImage.pkg" -t macos --apiKey "$API_KEY" --apiIssuer "$API_ISSUER" --p8-file-path "$key_path"
