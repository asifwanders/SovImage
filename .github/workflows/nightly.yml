name: upstream engine drift

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: upstream-engine-drift
  cancel-in-progress: true

permissions:
  contents: read

env:
  CUDA_VERSION: '12.5.0'

jobs:
  drift:
    name: upstream (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - id: upstream
        name: Check out upstream master
        shell: bash
        run: |
          git -C vendor/stable-diffusion.cpp fetch --depth=1 origin master
          git -C vendor/stable-diffusion.cpp checkout --detach FETCH_HEAD
          git -C vendor/stable-diffusion.cpp submodule update --init --recursive
          echo "sha=$(git -C vendor/stable-diffusion.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: toolchain
        name: Fingerprint native toolchain
        shell: bash
        run: echo "value=$(bash scripts/native-toolchain-fingerprint.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: engine-cache
        with:
          path: |
            vendor/sdcpp-build-mac
            vendor/sdcpp-build-win
            frontend/src-tauri/binaries
          key: upstream-sdcpp-${{ matrix.target }}-${{ steps.toolchain.outputs.value }}-cuda-${{ env.CUDA_VERSION }}-${{ steps.upstream.outputs.sha }}-${{ hashFiles('scripts/native-toolchain-fingerprint.sh', 'scripts/build-sdcpp-*', 'scripts/verify-sdcpp-cli.sh', 'scripts/verify-sdcpp-runtime.ps1') }}
      - name: Install CUDA toolkit
        if: matrix.os == 'windows-2022' && steps.engine-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","visual_studio_integration"]'
      - name: Build Metal engine
        if: matrix.os == 'macos-15' && steps.engine-cache.outputs.cache-hit != 'true'
        run: scripts/build-sdcpp-mac.sh
      - name: Build CUDA engine
        if: matrix.os == 'windows-2022' && steps.engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/build-sdcpp-win.ps1
      - name: Verify current SovImage CLI contract against upstream
        shell: bash
        run: |
          binary="frontend/src-tauri/binaries/sd-${{ matrix.target }}"
          if [[ "${{ matrix.os }}" == "windows-2022" ]]; then binary="$binary.exe"; fi
          scripts/verify-sdcpp-cli.sh "$binary" '${{ steps.upstream.outputs.sha }}'
      - name: Verify Windows runtime manifest
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: scripts/verify-sdcpp-runtime.ps1 -Root frontend/src-tauri/binaries -ExpectedEngineCommit '${{ steps.upstream.outputs.sha }}'

  report:
    name: report sanitized upstream drift
    if: always()
    needs: drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Open or update aggregate drift issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MATRIX_RESULT: ${{ needs.drift.result }}
        run: |
          marker='<!-- sovimage-engine-drift -->'
          number="$(gh issue list --repo "$REPOSITORY" --state open --limit 100 --json number,body \
            --jq ".[] | select(.body | contains(\"$marker\")) | .number" | head -1)"
          if [[ "$MATRIX_RESULT" == "success" ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --repo "$REPOSITORY" --comment "Upstream compatibility passed: $RUN_URL"
            fi
            exit 0
          fi
          jobs="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          failures="$(jq -r '.jobs[] | select(.conclusion != "success") | .name' <<<"$jobs" \
            | grep -E '^upstream \((aarch64-apple-darwin|x86_64-pc-windows-msvc)\)$' \
            | sort -u || true)"
          if [[ -z "$failures" ]]; then failures="upstream matrix result unavailable"; fi
          body="$marker
          The unprivileged upstream compatibility matrix failed or was cancelled.

          Sanitized failed jobs:
          $failures

          Run: $RUN_URL"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title 'engine: upstream drift' --body "$body"
          fi
